[project]
name = "code-runner"
version = "0.1.0"
description = "Universal Code Mode MCP server - executes LLM-generated code with access to all MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "sqlglot>=30.4.3",
]

[project.scripts]
code-runner = "code_runner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_runner"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# RUF001/002/003 не включаем: комментарии и докстроки здесь по-русски, и правило
# про "ambiguous unicode" помечает всю кириллицу. BLE001 тоже вне набора —
# в супервизорах (_ServerHost, _PoolHost, _safe_connect) поймать всё и отдать
# ошибку владельцу это намеренный контракт, а не небрежность.

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
tmp_path_retention_count = 3
addopts = "--basetemp=.pytest_tmp"
